<style>
:root{
  --bg:#E4ECFF;--surface:#FFFFFF;--ink:#0B1530;--muted:#5A678A;--line:#CBD8F5;
  --page:linear-gradient(180deg,#F3F7FF 0%,#E4ECFF 45%,#CFDCFB 100%);--shadow:0 6px 18px rgba(30,58,138,.14);
  --brand:#2F5BD9;--brand-ink:#FFFFFF;--accent:#1E3A8A;--wa:#16A34A;--warn:#B54708;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#050A1F;--surface:#0E1838;--ink:#EEF2FF;--muted:#9FB0DC;--line:#233566;
    --page:radial-gradient(120% 55% at 50% 0%,#14296B 0%,#08112E 50%,#030614 100%);--shadow:0 0 0 1px rgba(95,140,255,.18),0 8px 24px rgba(0,0,0,.55);
    --brand:#4A78FF;--brand-ink:#FFFFFF;--accent:#8FB0FF;--wa:#4ADE80;--warn:#F7B267;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#050A1F;--surface:#0E1838;--ink:#EEF2FF;--muted:#9FB0DC;--line:#233566;
  --page:radial-gradient(120% 55% at 50% 0%,#14296B 0%,#08112E 50%,#030614 100%);--shadow:0 0 0 1px rgba(95,140,255,.18),0 8px 24px rgba(0,0,0,.55);
  --brand:#4A78FF;--brand-ink:#FFFFFF;--accent:#8FB0FF;--wa:#4ADE80;--warn:#F7B267;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background-color:var(--bg);background-image:var(--page);background-attachment:fixed;color:var(--ink);font-family:"Readex Pro",Tahoma,sans-serif;line-height:1.6}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{padding:12px 16px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;background:#000;color:#E3B957;margin-bottom:12px;border-bottom:2px solid var(--brand)}
.logo{font-weight:700;font-size:1.6rem;letter-spacing:.04em;direction:ltr}
.logo i{opacity:.7;font-style:normal}
.tag{font-size:.85rem}
.logoimg{display:block;width:190px;max-width:60%;height:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:.9rem;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:500}
main{flex:1;padding:0 16px 96px}
.list{display:grid;gap:10px}
.svc{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:start;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer}
.svc b{display:block;font-weight:500}
.svc small{color:var(--muted)}
.price{white-space:nowrap;text-align:end;font-weight:700;color:var(--accent)}
.price small{display:block;font-weight:400}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr 1fr}
nav button{font:inherit;background:none;border:0;color:var(--muted);padding:14px;cursor:pointer}
nav button[aria-current="page"]{color:var(--accent);font-weight:700}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet-bg.open{display:flex}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto}
.sheet h3{margin:0 0 2px}
.sheet .sub{color:var(--muted);font-size:.85rem;margin-bottom:6px}
label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 5px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
input:focus,button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;padding-top:12px;border-top:1px dashed var(--line)}
.total b{font-size:1.6rem}
.err{color:var(--warn);font-size:.85rem;min-height:1.3em;margin-top:6px}
.btns{display:grid;gap:10px;margin-top:6px}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px;cursor:pointer;text-align:center;text-decoration:none;display:block}
.btn.main{background:var(--brand);color:var(--brand-ink)}
.btn.wa{background:var(--wa);color:#07210F}
.btn.ghost{background:none;color:var(--muted);font-weight:400;padding:8px}
.order{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.order .top{display:flex;justify-content:space-between;gap:8px;font-weight:500}
.order .meta{color:var(--muted);font-size:.82rem;word-break:break-all;direction:ltr;text-align:start}
.st{font-size:.78rem;padding:2px 10px;border-radius:999px;background:var(--bg);color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:48px 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 10px;cursor:pointer}
.tile b{font-weight:500}
.svc small{display:block}
.tile small{color:var(--muted)}
.bdg{flex:none}
img.bdg{display:block;object-fit:cover;background:none}
.bdg.big{width:68px;height:68px;border-radius:18px;font-size:2.1rem}
.back{font:inherit;background:none;border:0;color:var(--accent);padding:4px 0 12px;cursor:pointer}
.auth{position:fixed;inset:0;z-index:30;background:#000;color:#F3EEDF;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px))}
.authbox{width:100%;max-width:420px;text-align:start}
.authbox .logoimg{position:static;display:block;flex:none;object-fit:contain;margin:0 auto 18px;width:120px;max-width:45%;height:auto;transform:none;animation:none}
.authbox{position:relative;isolation:isolate}
.auth .seg{clear:both;margin-bottom:14px}
.auth-back{display:block;margin:0 0 14px;color:#F3EEDF}
#hi{white-space:normal;text-align:center}
#hi button{margin:0 5px}
.order-contact{border:0;border-bottom:1px solid var(--line);padding:0 0 12px;margin:0 0 12px}
.order-contact legend{font-weight:500}
.sheet{max-height:90dvh;overflow-y:auto}
.auth label{color:#A8A292}
.auth input{background:#14130F;color:#F3EEDF;border-color:#2E2B20}
.auth .chip{background:#14130F;color:#F3EEDF;border-color:#2E2B20;flex:1}
.auth .chip[aria-pressed="true"]{background:#4A78FF;color:#fff;border-color:#4A78FF}
.seg{display:flex;gap:8px;margin-bottom:6px}
.auth .err{color:#F7B267}
.out{font:inherit;background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;padding:0}
.svc,.tile,.order{box-shadow:var(--shadow)}
.tile:active,.svc:active{transform:scale(.99)}
.upd{display:flex;gap:10px;align-items:flex-start;background:var(--brand);color:var(--brand-ink);border-radius:14px;padding:12px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.updtx{flex:1;display:grid;gap:2px;font-size:.9rem}
.updx{font:inherit;font-size:1.5rem;line-height:1;background:none;border:0;color:inherit;cursor:pointer;padding:0 4px}
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.welcome p{color:var(--muted);margin:4px 0 12px;font-size:.9rem}
.pn{display:flex;align-items:center;gap:10px}
.pn img.bdg{width:46px;height:46px;border-radius:12px}
.num{font-size:1.3rem;font-weight:700;direction:ltr;text-align:start;letter-spacing:.04em;margin-top:6px;color:var(--accent)}
.cp{padding:4px 12px;font-size:.8rem}
.svc{flex-wrap:wrap}
.sdesc{flex-basis:100%;color:var(--muted);font-size:.8rem;border-top:1px dashed var(--line);padding-top:6px}
.intro{color:var(--muted);margin:0 0 12px;font-size:.92rem}
.srch{margin-bottom:12px}
.fab{position:fixed;left:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:15;width:54px;height:54px;border-radius:15px;box-shadow:0 4px 14px rgba(0,0,0,.35);overflow:hidden;display:block}
.fab img{width:100%;height:100%;display:block;object-fit:cover}
.soc{display:grid;gap:8px}
.sl{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none;background:var(--bg)}
.sl img{width:34px;height:34px;border-radius:9px;display:block}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
summary{cursor:pointer;font-weight:500}
details p{color:var(--muted);margin:8px 0 0;font-size:.92rem}
.steps{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:.88rem;color:var(--ink)}
.steps ol{margin:6px 0 10px;padding-inline-start:22px}
.steps ol:last-child{margin-bottom:0}
.tag{font-style:normal;font-size:.7rem;font-weight:500;background:var(--brand);color:var(--brand-ink);border-radius:999px;padding:2px 8px;margin-inline-start:6px;white-space:nowrap}
.ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:18px;overflow:hidden}
.ovbox{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:22px 18px;max-width:380px;width:100%;text-align:center;position:relative;z-index:2;max-height:92%;overflow-y:auto}
.ovbox img.ovlogo{width:120px;max-width:50%;display:block;margin:0 auto 10px;border-radius:12px}
.ovbox h3{margin:6px 0}
.ovbox p{color:var(--muted);margin:6px 0 14px}
.ovbox .btn{margin-top:8px}
.cf{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;opacity:.9;animation:cfall linear forwards;z-index:1}
@keyframes cfall{to{transform:translateY(115vh) rotate(540deg)}}
.splash{position:fixed;inset:0;z-index:60;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .5s}
.splash.hide{opacity:0}
.spw{position:relative;overflow:hidden;width:min(240px,62vw)}
.spw img{width:100%;display:block;animation:spin_in 1.2s ease-out both}
.spw::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,225,150,.55),transparent);animation:sweep 1.6s .5s ease-in-out both}
@keyframes spin_in{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
@keyframes sweep{to{left:130%}}
.wheelwrap{position:relative;width:260px;height:260px;margin:14px auto 14px}
.wheel{width:100%;height:100%;border-radius:50%;border:6px solid var(--brand);position:relative;transition:transform 4.2s cubic-bezier(.12,.7,.1,1);background:conic-gradient(var(--brand) 0 45deg,#1b1b1b 45deg 90deg,var(--brand) 90deg 135deg,#1b1b1b 135deg 180deg,var(--brand) 180deg 225deg,#1b1b1b 225deg 270deg,var(--brand) 270deg 315deg,#1b1b1b 315deg 360deg)}
.wl{position:absolute;left:50%;top:50%;margin:-14px 0 0 -22px;width:44px;height:28px;display:grid;place-items:center;font-size:.85rem;font-weight:700}
.ptr{position:absolute;top:-12px;left:50%;margin-left:-12px;width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid var(--ink);z-index:3}
@media(prefers-reduced-motion:reduce){.cf,.spw img,.spw::after{animation:none!important}.wheel{transition:none!important}}
textarea{resize:vertical}
.stories{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.st{flex:none;display:grid;justify-items:center;gap:6px;background:none;border:0;color:var(--ink);font:inherit;cursor:pointer;width:70px}
.ring{width:64px;height:64px;border-radius:20px;padding:3px;background:conic-gradient(var(--brand),#D4A73C,var(--brand));display:block}
.ring img,.ring>span{width:100%;height:100%;border-radius:17px;display:block;border:2px solid var(--bg);object-fit:cover}
.lbl{font-size:.7rem;text-align:center;line-height:1.25;max-width:70px}
.story{position:fixed;inset:0;z-index:45;color:#fff;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sbars{display:flex;gap:4px;position:relative;z-index:3}
.sbar{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.28);overflow:hidden}
.sbar i{display:block;height:100%;width:0;background:#fff}
@keyframes sfill{from{width:0}to{width:100%}}
.stop{display:flex;align-items:center;gap:10px;margin-top:12px;position:relative;z-index:3}
.stop .bdg{width:36px;height:36px;border-radius:10px;font-size:1rem}
.stop b{flex:1}
.sx{font:inherit;font-size:1.8rem;line-height:1;background:none;border:0;color:#fff;cursor:pointer;padding:0 6px}
.sbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;position:relative;z-index:2;pointer-events:none;padding:0 6px}
.sbody button,.sbody a{pointer-events:auto}
.sbody h2{font-size:1.6rem;margin:0}
.sbody .sprice{font-size:2.6rem;font-weight:700}
.sbody .ssub{opacity:.82}
.sbody .stag{background:#fff;color:#111;border-radius:999px;padding:3px 12px;font-size:.8rem;font-weight:500}
.sbody .bdg.big{width:96px;height:96px;border-radius:26px;font-size:3rem}
.sbody .btn{min-width:240px}
.snav{position:absolute;inset:0;display:flex;z-index:1}
.snav button{flex:1;background:none;border:0;cursor:pointer}
header{position:relative;overflow:hidden}
header>*{position:relative;z-index:1}
header::before{content:"";position:absolute;left:50%;top:38%;width:300px;height:300px;margin:-150px 0 0 -150px;background:radial-gradient(circle,rgba(212,167,60,.38),transparent 62%);animation:glow 3.6s ease-in-out infinite;z-index:0;pointer-events:none}
header::after{content:"";position:absolute;top:0;bottom:0;width:28%;left:-40%;background:linear-gradient(100deg,transparent,rgba(255,225,150,.16),transparent);animation:hsweep 6s ease-in-out infinite;z-index:2;pointer-events:none}

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return memStore[k]||null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){memStore[k]=v}}
function users(){try{return JSON.parse(lsGet("mrd_users")||"[]")}catch(e){return[]}}
function orderKey(){return me?"mrd_orders_"+me.phone:"mrd_guest_orders"}

function renderAccount(){
  var hi=$("hi");hi.textContent=me?"أهلاً "+me.name:"تصفح الأسعار واطلب من غير حساب";
  var b=document.createElement("button");b.className="out";b.type="button";b.textContent=me?"خروج":"دخول / حساب جديد";

}
function openAuth(){closeSheet();setMode(users().length?"in":"up");$("auth").style.display="flex";$("auth").scrollTop=0}
$("browse").onclick=function(){$("auth").style.display="none"};
function sha(t){
  if(window.crypto&&crypto.subtle&&window.TextEncoder){
    return crypto.subtle.digest("SHA-256",new TextEncoder().encode("mrd:"+t)).then(function(h){
      return Array.from(new Uint8Array(h)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")});
  }
  return Promise.resolve("p:"+t);
}
function digits(v){return v.replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d)}).replace(/[^\d]/g,"")}
function aerr(m){$("aerr").textContent=m}
function setMode(m){
  mode=m;$("mIn").setAttribute("aria-pressed",m==="in");$("mUp").setAttribute("aria-pressed",m==="up");
  var d=m==="up"?"block":"none";$("nl").style.display=d;$("aname").style.display=d;$("rl").style.display=d;$("aref").style.display=d;
  $("aok").textContent=m==="up"?"إنشاء الحساب":"دخول";aerr("");
}
function enter(u){
  me=u;lsSet("mrd_session",u.phone);loadOrders();
  $("auth").style.display="none";$("apass").value="";
  renderAccount();showServices();
}
function logout(){
  me=null;lsSet("mrd_session","");loadOrders();
  $("aname").value="";$("apass").value="";
  $("auth").style.display="none";renderAccount();showServices();
}
$("mIn").onclick=function(){setMode("in")};
$("mUp").onclick=function(){setMode("up")};
$("aok").onclick=function(){
  var ph=digits($("aphone").value),pw=$("apass").value,nm=$("aname").value.trim();
  if(ph.length<10||ph.length>15){aerr("اكتب رقم واتساب صحيح");return}
  if(pw.length<4){aerr("كلمة السر لازم تكون 4 حروف أو أرقام على الأقل");return}
  if(mode==="up"&&nm.length<2){aerr("اكتب اسمك");return}
  sha(ph+pw).then(function(h){
    var us=users(),ex=us.filter(function(u){return u.phone===ph})[0];
    if(mode==="up"){
      if(ex){aerr("الرقم ده مسجّل قبل كده. اختار تسجيل دخول");return}
      var u={phone:ph,name:nm,ref:$("aref").value.trim().slice(0,40),hash:h};us.push(u);lsSet("mrd_users",JSON.stringify(us));enter(u);
    }else{
      if(!ex||ex.hash!==h){aerr("الرقم أو كلمة السر غلط");return}
      enter(ex);
    }
  });
};
function startAuth(){
  showSplash();
  $("fabimg").src=BADGES["واتساب"].img;
  $("fab").href="https://wa.me/"+WHATSAPP;
  $("fab").onclick=function(){$("fab").href="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent("مرحباً M.R.D"+(me?"\nالاسم: "+me.name+"\nرقمي: "+me.phone:"")+"\nعندي استفسار")};
  $("alogo").src=document.querySelector("header .logoimg").src;
  $("auth").style.display="none";
  var sess=lsGet("mrd_session"),u=sess?users().filter(function(x){return x.phone===sess})[0]:null;
  if(u){enter(u)}else{loadOrders();renderAccount();showServices();setMode(users().length?"in":"up")}
}

function applyTheme(pn){
  var r=document.documentElement.style,props=["--brand","--brand-ink","--accent","--bg","--surface","--line","--page","--shadow"];
  var t=pn&&THEMES[pn];
  if(!t){props.forEach(function(k){r.removeProperty(k)});return}
  var dark=!!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches),s=t.s==null?1:t.s,h=t.h;
  function S(x){return Math.round(x*s)+"%"}
  var v;
  if(dark){
    v={"--brand":t.bd||t.b,"--brand-ink":t.di||t.i,"--accent":t.ad,
       "--bg":"hsl("+h+" "+S(60)+" 6%)","--surface":"hsl("+h+" "+S(45)+" 12%)","--line":"hsl("+h+" "+S(40)+" 24%)",
       "--page":"radial-gradient(120% 55% at 50% 0%,hsl("+h+" "+S(65)+" 22%) 0%,hsl("+h+" "+S(60)+" 9%) 50%,hsl("+h+" "+S(60)+" 4%) 100%)",
       "--shadow":"0 8px 24px rgba(0,0,0,.55)"};
  }else{
    v={"--brand":t.b,"--brand-ink":t.i,"--accent":t.a,
       "--bg":"hsl("+h+" "+S(100)+" 94%)","--surface":"hsl("+h+" "+S(100)+" 97%)","--line":"hsl("+h+" "+S(70)+" 87%)",
       "--page":"linear-gradient(180deg,hsl("+h+" "+S(100)+" 98%) 0%,hsl("+h+" "+S(95)+" 94%) 45%,hsl("+h+" "+S(80)+" 86%) 100%)",
       "--shadow":"0 6px 18px hsl("+h+" "+S(60)+" 40% / .16)"};
  }
  Object.keys(v).forEach(function(k){r.setProperty(k,v[k])});
}

function copyText(t,btn){
  function done(){btn.textContent="تم النسخ";setTimeout(function(){btn.textContent="نسخ"},1500)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,function(){fallback()})}else{fallback()}
  function fallback(){
    var ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(e){}ta.remove();
  }
}
